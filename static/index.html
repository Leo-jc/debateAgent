<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>辩论场 · DebateAgent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #21201C;        /* 玄墨 */
    --paper: #F6F5F1;      /* 云白 */
    --pro: #C3272B;        /* 朱砂 · 正方 */
    --con: #2F5A8F;        /* 靛青 · 反方 */
    --judge: #8A867C;      /* 判官灰 */
    --line: #E3DFD6;       /* 纸影 */
    --mono: "JetBrains Mono", monospace;
    --serif: "Noto Serif SC", serif;
    --sans: "Noto Sans SC", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.7;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  /* ── 输入区 ── */
  .arena-input {
    max-width: 860px;
    margin: 0 auto;
    padding: 48px 24px 24px;
  }
  .arena-input .eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.3em;
    color: var(--judge);
    margin-bottom: 8px;
  }
  h1 {
    font-family: var(--serif);
    font-weight: 900;
    font-size: clamp(28px, 5vw, 44px);
    margin-bottom: 24px;
  }
  h1 .vs { color: var(--judge); font-weight: 600; padding: 0 0.2em; }
  h1 .t-pro { color: var(--pro); }
  h1 .t-con { color: var(--con); }
  .topic-row { display: flex; gap: 12px; }
  #topic {
    flex: 1;
    font: 500 18px var(--sans);
    padding: 14px 18px;
    border: 2px solid var(--ink);
    background: #fff;
    outline: none;
  }
  #topic:focus { border-color: var(--pro); }
  #start {
    font: 700 18px var(--sans);
    padding: 14px 32px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    cursor: pointer;
    white-space: nowrap;
  }
  #start:disabled { opacity: 0.4; cursor: not-allowed; }
  #start:focus-visible, #topic:focus-visible { outline: 3px solid var(--con); outline-offset: 2px; }
  #status {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--judge);
    margin-top: 10px;
    min-height: 20px;
  }
  #status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--pro); margin-right: 6px; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }
  #errbar {
    display: none;
    margin-top: 12px;
    padding: 10px 16px;
    background: var(--pro);
    color: #fff;
    font-size: 14px;
  }

  /* ── 直播区：中央对峙线 ── */
  .arena {
    max-width: 960px;
    margin: 0 auto;
    padding: 12px 24px 80px;
    position: relative;
    display: none;
  }
  .arena.live { display: block; }
  .arena::before {           /* 中线 */
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    left: 50%;
    width: 2px;
    background: var(--line);
  }
  .split-bar {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    margin: 24px 0 32px;
  }
  .split-bar .pos {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 15px;
    padding: 10px 16px;
    background: #fff;
    border: 1px solid var(--line);
    max-width: 44%;
  }
  .split-bar .pos b { font-family: var(--mono); font-size: 12px; display: block; letter-spacing: 0.2em; margin-bottom: 2px; }
  .split-bar .pos.pro b { color: var(--pro); }
  .split-bar .pos.con b { color: var(--con); }

  .card {
    max-width: 46%;
    padding: 14px 18px;
    margin-bottom: 20px;
    background: #fff;
    border: 1px solid var(--line);
    position: relative;
  }
  .card.pro { border-left: 4px solid var(--pro); margin-right: auto; }
  .card.con { border-right: 4px solid var(--con); margin-left: auto; text-align: left; }
  .card .tag {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.15em;
    margin-bottom: 6px;
  }
  .card.pro .tag { color: var(--pro); }
  .card.con .tag { color: var(--con); }
  .card .speech { font-size: 15px; white-space: pre-wrap; }
  .cursor { display: inline-block; width: 9px; height: 1.1em; background: var(--ink); vertical-align: text-bottom; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* 裁判判定卡：骑在中线上 */
  .judge-card {
    max-width: none;
    width: 60%;
    margin: 28px auto;
    border-top: 3px solid var(--judge);
    border-left: none; border-right: none;
    text-align: center;
    padding: 12px 20px;
  }
  .judge-card .tag { color: var(--judge); }
  .judge-card .verdict { font-family: var(--serif); font-weight: 600; font-size: 15px; }
  .judge-card .verdict .st-continue { color: var(--judge); }
  .judge-card .verdict .st-concede { color: var(--ink); font-weight: 900; }

  /* 签名元素：认输印章 */
  .stamp {
    position: absolute;
    top: -18px;
    right: -14px;
    width: 52px; height: 52px;
    border: 4px solid;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--serif);
    font-weight: 900; font-size: 28px;
    transform: rotate(8deg);
    background: rgba(255,255,255,0.85);
    animation: stamp 0.45s cubic-bezier(0.2, 2.2, 0.4, 1) both;
  }
  .stamp.s-pro { color: var(--pro); border-color: var(--pro); }
  .stamp.s-con { color: var(--con); border-color: var(--con); }
  @keyframes stamp { from { transform: rotate(8deg) scale(1.6); opacity: 0; } to { transform: rotate(8deg) scale(1); opacity: 1; } }

  /* ── 战报区 ── */
  .report {
    width: 78%;
    margin: 48px auto 0;
    border-top: 3px double var(--ink);
    padding-top: 20px;
    display: none;
  }
  .report.show { display: block; }
  .report .end-reason {
    font-family: var(--serif);
    font-weight: 900;
    font-size: 20px;
    text-align: center;
    margin-bottom: 16px;
  }
  .report pre {
    font-family: var(--sans);
    font-size: 14px;
    white-space: pre-wrap;
    max-height: 420px;
    overflow-y: auto;
    background: #fff;
    border: 1px solid var(--line);
    padding: 16px;
  }
  .report .dl {
    display: block;
    margin: 14px auto 0;
    font: 700 15px var(--sans);
    padding: 10px 28px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    cursor: pointer;
  }
  .report .dl:focus-visible { outline: 3px solid var(--con); outline-offset: 2px; }

  @media (max-width: 640px) {
    .card { max-width: 88%; }
    .judge-card { width: 88%; }
    .report { width: 100%; }
    .topic-row { flex-direction: column; }
  }
</style>
</head>
<body>

<section class="arena-input">
  <p class="eyebrow">DEBATE AGENT · 对峙线</p>
  <h1><span class="t-pro">正方</span><span class="vs">对</span><span class="t-con">反方</span></h1>
  <div class="topic-row">
    <input id="topic" placeholder="输入辩题，如：人类应不应该追求长生不老" autofocus>
    <button id="start">开始辩论</button>
  </div>
  <div id="status"></div>
  <div id="errbar"></div>
</section>

<section class="arena" id="arena">
  <div class="split-bar" id="splitBar" style="visibility:hidden">
    <div class="pos pro"><b>正方命题</b><span id="posPro"></span></div>
    <div class="pos con"><b>反方命题</b><span id="posCon"></span></div>
  </div>
  <div id="stream"></div>

  <div class="report" id="report">
    <p class="end-reason" id="endReason"></p>
    <pre id="reportBody"></pre>
    <button class="dl" id="download">下载战报 .md</button>
  </div>
</section>

<script src="/app.js"></script>
</body>
</html>
